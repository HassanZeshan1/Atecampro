<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Key Manager</title>
<style>
  :root { --bg:#0b0b12; --card:#151521; --accent:#7c5cff; --text:#eee; --muted:#9a9aab; --danger:#ff5c5c; --ok:#5cff9d; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; padding:24px; }
  .wrap { max-width:820px; margin:0 auto; }
  h1 { font-size:22px; margin-bottom:4px; }
  p.sub { color:var(--muted); margin-top:0; margin-bottom:24px; font-size:14px; }
  .card { background:var(--card); border:1px solid #232336; border-radius:14px; padding:22px; margin-bottom:22px; }
  label { font-size:13px; color:var(--muted); display:block; margin-bottom:6px; }
  input { width:100%; padding:11px 14px; border-radius:8px; border:1px solid #2a2a3d; background:#0f0f18; color:var(--text); font-size:14px; margin-bottom:14px; }
  input:focus { outline:none; border-color:var(--accent); }
  button { padding:11px 18px; border:none; border-radius:8px; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; font-size:14px; }
  button.secondary { background:#232336; }
  button.danger { background:var(--danger); }
  button:hover { opacity:.9; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:10px 8px; border-bottom:1px solid #232336; }
  th { color:var(--muted); font-weight:500; }
  .badge { padding:3px 8px; border-radius:6px; font-size:11px; font-weight:600; }
  .badge.active { background:rgba(92,255,157,.15); color:var(--ok); }
  .badge.blocked { background:rgba(255,92,92,.15); color:var(--danger); }
  .key-mono { font-family:monospace; letter-spacing:.5px; }
  .msg { font-size:13px; margin-top:8px; min-height:18px; }
  .msg.error { color:var(--danger); }
  .msg.ok { color:var(--ok); }
  .row { display:flex; gap:10px; align-items:center; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🛠️ License Key Admin</h1>
  <p class="sub">Keys generate karo, block/unblock karo, aur usage dekho.</p>

  <div class="card">
    <label for="adminSecret">Admin Secret</label>
    <input id="adminSecret" type="password" placeholder="Netlify ADMIN_SECRET env var value">

    <div class="row">
      <div style="flex:1">
        <label for="label">Label (optional, e.g. "Rehan ke liye")</label>
        <input id="label" placeholder="optional note">
      </div>
      <div style="width:160px">
        <label for="hours">Daily limit (hours)</label>
        <input id="hours" type="number" value="2" min="0.1" step="0.1">
      </div>
    </div>
    <button onclick="generateKey()">+ Generate New Key</button>
    <div class="msg" id="genMsg"></div>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between; margin-bottom:14px;">
      <strong>All Keys</strong>
      <button class="secondary" onclick="loadKeys()">↻ Refresh</button>
    </div>
    <table>
      <thead>
        <tr><th>Key</th><th>Label</th><th>Status</th><th>Today's usage</th><th>Action</th></tr>
      </thead>
      <tbody id="keysBody"></tbody>
    </table>
    <div class="msg" id="listMsg"></div>
  </div>
</div>

<script>
const FUNCTIONS_BASE = '/.netlify/functions';

function secret() {
  return document.getElementById('adminSecret').value.trim();
}

function fmtSeconds(s) {
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  return `${h}h ${m}m`;
}

async function generateKey() {
  const genMsg = document.getElementById('genMsg');
  const label = document.getElementById('label').value.trim();
  const hours = parseFloat(document.getElementById('hours').value) || 2;

  genMsg.className = 'msg';
  genMsg.textContent = 'Generating...';

  try {
    const res = await fetch(`${FUNCTIONS_BASE}/generate-key`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-admin-secret': secret() },
      body: JSON.stringify({ label, dailyLimitSeconds: Math.round(hours * 3600) })
    });
    const data = await res.json();
    if (!res.ok || !data.ok) {
      genMsg.className = 'msg error';
      genMsg.textContent = data.error || 'Failed — check admin secret';
      return;
    }
    genMsg.className = 'msg ok';
    genMsg.textContent = `✅ New key: ${data.key}`;
    document.getElementById('label').value = '';
    loadKeys();
  } catch (e) {
    genMsg.className = 'msg error';
    genMsg.textContent = 'Network error';
  }
}

async function loadKeys() {
  const listMsg = document.getElementById('listMsg');
  const body = document.getElementById('keysBody');
  listMsg.textContent = 'Loading...';
  listMsg.className = 'msg';

  try {
    const res = await fetch(`${FUNCTIONS_BASE}/list-keys`, {
      headers: { 'x-admin-secret': secret() }
    });
    const data = await res.json();
    if (!res.ok || !data.ok) {
      listMsg.className = 'msg error';
      listMsg.textContent = data.error || 'Failed — check admin secret';
      body.innerHTML = '';
      return;
    }
    listMsg.textContent = '';
    body.innerHTML = data.keys.map(k => `
      <tr>
        <td class="key-mono">${k.key}</td>
        <td>${k.label || '—'}</td>
        <td><span class="badge ${k.blocked ? 'blocked' : 'active'}">${k.blocked ? 'Blocked' : 'Active'}</span></td>
        <td>${fmtSeconds(k.usedTodaySeconds)} / ${fmtSeconds(k.dailyLimitSeconds)}</td>
        <td>
          <button class="${k.blocked ? '' : 'danger'}" style="padding:6px 10px;font-size:12px"
            onclick="toggleBlock('${k.key}', ${!k.blocked})">
            ${k.blocked ? 'Unblock' : 'Block'}
          </button>
        </td>
      </tr>
    `).join('');
  } catch (e) {
    listMsg.className = 'msg error';
    listMsg.textContent = 'Network error';
  }
}

async function toggleBlock(key, blocked) {
  try {
    const res = await fetch(`${FUNCTIONS_BASE}/block-key`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-admin-secret': secret() },
      body: JSON.stringify({ key, blocked })
    });
    const data = await res.json();
    if (data.ok) loadKeys();
  } catch (e) {}
}
</script>
</body>
</html>
